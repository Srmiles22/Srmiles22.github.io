<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Charity: water landing page for clean water access and volunteer action."
    />
    <title>Charity: Water</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="Charity: Water home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">charity: water</span>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#">Take Action</a>
          <a href="#">About Us</a>
          <a href="#">Why Water?</a>
          <a href="#">Sign In</a>
        </nav>

        <button class="give-btn" type="button" aria-label="Give to charity water">
          <span class="drop-icon" aria-hidden="true"></span>
          <span>Give</span>
        </button>
      </header>

      <main class="hero" aria-label="Mission statement">
        <div class="hero-content">
          <h1>
            Access to<br />
            <span>Clean Water</span> is<br />
            the Key to a<br />
            Degree
          </h1>

          <p class="hero-copy">
            No child should miss school to walk for water. We’re calling all college
            organizations to spread education access by donating their time not money!
          </p>

          <button class="cta-btn" type="button">Become a Volunteer Today</button>
        </div>
      </main>
    </div>
  </body>
</html>
